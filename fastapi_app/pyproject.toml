[project]
name = "voice-qa-agent"
version = "0.1.0"
description = "Voice QA project"
authors = [
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (==0.136.3)",
    "pydantic (==2.13.4)",
    "python-dotenv (==1.2.2)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "greenlet (>=3.5.1,<4.0.0)",
    "supabase (>=2.30.1,<3.0.0)",
    "pytest (>=9.0.3,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
